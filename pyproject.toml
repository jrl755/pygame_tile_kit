[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pygame-tile-kit"
version = "0.2.0"
description = "Generic tile metadata + registry/query engine for tile-based 2D games"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
authors = [
    {name = "John R. Lehman"}
]
keywords = ["pygame", "pygame-ce", "tiles", "level-design", "tile-registry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries",
]
# Deliberately no pygame-ce dependency, unlike pygame_display_kit: this
# package's enums/dataclasses/registry do zero pygame API calls (no
# Surface, no display, no events) - it's pure metadata and query logic,
# consumable by a non-pygame project too.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/jrl755/pygame_tile_kit"
Repository = "https://github.com/jrl755/pygame_tile_kit"
Issues = "https://github.com/jrl755/pygame_tile_kit/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pygame_tile_kit*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
